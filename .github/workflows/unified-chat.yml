name: Unified AI Gym Buddy verification
on:
  push:
    branches: [feat/gym-buddy-unified-chat]
    paths: ['shared/buddy*.ts','server/src/buddy/**','server/src/companion/training/router.ts','server/src/companion/training/legacyRouter.ts','src/components/buddy/**','src/components/Chatbot.tsx','tests/buddy/**','data/education/**','tsconfig.buddy.json','.github/workflows/unified-chat.yml']
  pull_request:
    paths: ['shared/buddy*.ts','server/src/buddy/**','src/components/buddy/**','tests/buddy/**','.github/workflows/unified-chat.yml']
permissions:
  contents: read
concurrency:
  group: buddy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unified tests
        run: |
          mkdir -p test-results/buddy
          set -o pipefail
          node --import tsx --test tests/buddy/*.test.ts | tee test-results/buddy/buddy.tap
      - name: Type checking
        run: |
          npx --no-install tsc -p tsconfig.buddy.json --noEmit > test-results/buddy/typecheck-buddy.txt 2>&1
          npm run typecheck:training > test-results/buddy/typecheck-training.txt 2>&1
          npm run lint > test-results/buddy/typecheck.txt 2>&1
      - name: Existing regression and source policy
        run: |
          set -o pipefail
          node --import tsx --test tests/posture-correction.test.ts tests/fatloss-metabolic.test.ts tests/height-posture.test.ts tests/weight-gain.test.ts tests/fitness-flexibility.test.ts | tee test-results/buddy/programs.tap
          npm run test:training | tee test-results/buddy/training.tap
          node --import tsx --test tests/nutrition/*.test.ts tests/pathways/*.test.ts tests/gym-assets.test.ts | tee test-results/buddy/sources.tap
          npm run build:index -- --check > test-results/buddy/index-check.txt 2>&1
          npm run build > test-results/buddy/build.txt 2>&1
      - name: Measure source-card path without model calls
        run: node --import tsx tests/buddy/benchmark.ts > test-results/buddy/benchmark-output.txt
      - name: Export reviewed source and patch even when checks fail
        if: always()
        run: |
          mkdir -p test-results/buddy
          python3 - <<'PY'
          import subprocess, pathlib, tarfile
          base='d3269c43c64e13482e5c8ba423a36a4f62e9962f'
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          with tarfile.open('test-results/buddy/source.tar.gz','w:gz') as out:
              for p in paths:
                  if pathlib.Path(p).is_file() and 'PRIVATE' not in p and not p.endswith('.zip'):
                      out.add(p,arcname=p,recursive=False)
          pathlib.Path('test-results/buddy/unified-chat.patch').write_bytes(subprocess.check_output(['git','diff','--binary',base,'HEAD']))
          pathlib.Path('test-results/buddy/commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buddy-verification
          path: test-results/buddy
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real React and HTTP harness with synthetic identity/provider
        run: |
          mkdir -p test-results/buddy-browser
          NODE_ENV=test node --import tsx tests/buddy/ui-server.ts > test-results/buddy-browser/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4175/__test/status > /dev/null; then break; fi
            sleep 1
          done
          python tests/buddy/browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buddy-browser
          path: test-results/buddy-browser
          retention-days: 7
