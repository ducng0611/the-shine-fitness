name: Apply reviewed fitness-flexibility patch
on:
  push:
    branches: [feat/fitness-flexibility-program]
    paths: ['.github/workflows/flex-apply.yml']
permissions:
  contents: write
concurrency:
  group: apply-fitness-flexibility-feature-only
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/fitness-flexibility-program'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fitness-flexibility-program
          fetch-depth: 0
      - name: Validate exact bytes and permitted paths
        shell: bash
        run: |
          test "$(git branch --show-current)" = 'feat/fitness-flexibility-program'
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'scripts/flex-transfer.part{i}').read_text().strip() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ac0c9595f0c71e083601057a61359bc4b1fedfa2ec660151a23e9184e129051c', 'Unexpected patch bytes'
          expected = {'scripts/build_index.ts','server/src/ragEngine.ts','server/src/handoverRules.ts','server/src/intentClassifier.ts','server/src/companion/training/intent.ts','server/src/index.ts','shared/programSafety.ts','shared/ragDocument.ts','shared/trainingPrograms.ts','scripts/validate-fitness-flexibility.ts','scripts/merge-training-programs.ts','tests/fitness-flexibility.test.ts','data/knowledge/08_program_fitness_flexibility.md','data/companion/training_programs.json','data/training-pathways/fitness-flexibility/README.md','data/training-pathways/fitness-flexibility/source-status.json','docs/fitness-flexibility-review.md'}
          actual = {line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')}
          assert actual == expected, 'Unexpected patch paths'
          Path('/tmp/flex.patch').write_bytes(patch)
          Path('/tmp/flex-paths').write_text('\n'.join(sorted(expected))+'\n')
          PY
          git apply --check /tmp/flex.patch
          git apply /tmp/flex.patch
      - name: Commit only reviewed public files
        shell: bash
        run: |
          while IFS= read -r path; do git add -- "$path"; done < /tmp/flex-paths
          git rm scripts/flex-transfer.part1 scripts/flex-transfer.part2 scripts/flex-transfer.part3 scripts/flex-transfer.part4
          test -z "$(git diff --cached --name-only -- .github/workflows/)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(programs): fitness-flexibility reference data and youth safety routing'
          git push origin HEAD:feat/fitness-flexibility-program
