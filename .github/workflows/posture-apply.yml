name: Apply reviewed posture source
on:
  push:
    branches: [feat/posture-correction-program]
    paths: ['.github/workflows/posture-apply.yml']
permissions:
  contents: write
concurrency:
  group: posture-reviewed-application
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/posture-correction-program'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/posture-correction-program
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check baseline and apply exact reviewed patch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feat/posture-correction-program'
          git merge-base --is-ancestor 86aeef946c6f50661b49c086327511d02882e355 HEAD
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''.join(Path(f'scripts/posture-patch.part{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b0101c36641916aa2b75bd1a41dfc8b80248fd1c207d2ccb6286dba794bbcb16'
          Path('/tmp/posture-reviewed.patch').write_bytes(patch)
          PY
          git apply --check /tmp/posture-reviewed.patch
          git apply --index /tmp/posture-reviewed.patch
      - name: Generate library with no provider or database calls
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install tsx scripts/prepare-posture-correction.ts --out /tmp/posture-programs.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('/tmp/posture-programs.json').read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'e0e910df18df14dcb69016aa5151705cd13396f72e76835dd28fc02806466649'
          Path('data/companion/training_programs.json').write_bytes(data)
          PY
          git add data/companion/training_programs.json
          npx --no-install tsx scripts/validate-posture-correction.ts --report
      - name: Commit reviewed application files only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
            'data/companion/training_programs.json',
            'data/knowledge/11_program_posture_correction.md',
            'data/training-pathways/posture-correction/README.md',
            'data/training-pathways/posture-correction/scientific-claims.review.json',
            'data/training-pathways/posture-correction/source-sessions.json',
            'data/training-pathways/posture-correction/source-status.json',
            'docs/posture-correction-review.vi.md',
            'docs/test-checklist.md',
            'scripts/prepare-posture-correction.ts',
            'scripts/validate-fatloss-metabolic.ts',
            'scripts/validate-posture-correction.ts',
            'server/src/intentClassifier.ts',
            'shared/postureCorrectionProgram.ts',
            'shared/postureSafety.ts',
            'shared/programSafety.ts',
            'shared/ragDocument.ts',
            'shared/trainingPrograms.ts',
            'tests/fatloss-metabolic.test.ts',
            'tests/fixtures/posture-correction-baseline.json',
            'tests/posture-correction.test.ts'
          }
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert changed == expected, changed.symmetric_difference(expected)
          PY
          git rm scripts/posture-patch.part0.b64 scripts/posture-patch.part1.b64 scripts/posture-patch.part2.b64 scripts/posture-patch.part3.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(programs): add source-faithful desk-worker posture reference'
          git push origin HEAD:feat/posture-correction-program
