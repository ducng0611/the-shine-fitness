name: Shine Companion integration and checks
on:
  push:
    branches: [feat/shine-ai-companion]
    paths:
      - '.github/workflows/shine-companion.yml'
      - 'scripts/integrate_companion.mjs'
      - 'server/src/companion/**'
      - 'src/components/companion/**'
      - 'tests/companion.test.mjs'
permissions:
  contents: write
concurrency:
  group: shine-companion-preview
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/shine-ai-companion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shine-ai-companion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded integration edits
        run: node scripts/integrate_companion.mjs
      - name: Domain tests
        run: |
          set -o pipefail
          node --test tests/companion.test.mjs | tee companion-tests.txt
      - name: Reconcile existing manifest-lock mismatch
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit integration and repaired lock on feature branch only
        run: |
          git add server/src/index.ts src/App.tsx .env.example README.md firestore.rules src/components/companion/CompanionChat.tsx server/src/companion/router.ts package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: reconcile existing lockfile and companion integration'
            git push origin HEAD:feat/shine-ai-companion
          fi
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee companion-types.txt
      - name: Production build
        if: success() || failure()
        run: |
          set -o pipefail
          npm run build 2>&1 | tee companion-build.txt
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-verification
          path: |
            companion-tests.txt
            companion-types.txt
            companion-build.txt
          retention-days: 7
