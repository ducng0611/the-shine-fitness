name: Shine Companion integration and checks
on:
  push:
    branches: [feat/shine-ai-companion]
    paths: ['scripts/integrate_companion.mjs']
permissions:
  contents: write
concurrency:
  group: shine-companion-preview
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/shine-ai-companion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shine-ai-companion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded integration edits
        run: node scripts/integrate_companion.mjs
      - name: Domain tests
        run: node --test tests/companion.test.mjs
      - name: Commit integration on feature branch only
        run: |
          git add server/src/index.ts src/App.tsx .env.example README.md firestore.rules
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: integrate authenticated Shine Companion behind feature flags'
            git push origin HEAD:feat/shine-ai-companion
          fi
      - name: Install dependencies without lifecycle scripts
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts --package-lock=false; fi
      - name: Type check
        run: npm run lint
      - name: Production build
        if: success() || failure()
        run: npm run build
