name: Apply reviewed pathway implementation
on:
  push:
    branches: [feat/training-pathway-intake]
    paths: ['.github/workflows/pathway-apply.yml']
permissions:
  contents: write
concurrency:
  group: apply-pathway-feature-only
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/training-pathway-intake'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-pathway-intake
          fetch-depth: 0
      - name: Validate exact patch bytes and touched paths
        shell: bash
        run: |
          test "$(git branch --show-current)" = 'feat/training-pathway-intake'
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          content = ''.join(Path(f'scripts/pathway-patch.part{i}').read_text().strip() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(content, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '49fc70454f0e871248d0ba2e98defc69935ae7a59ecdc3b4bdec4b3337218682', 'Patch bytes mismatch'
          Path('/tmp/pathway.patch').write_bytes(patch)
          expected = {'.gitignore','.env.example','firestore.rules','server/src/index.ts','src/components/admin/AdminGymKnowledgeTab.tsx','vite.config.ts','shared/pathwayIntake.ts','scripts/extract-pathway-tracker.py','tsconfig.pathways.json','.github/workflows/pathway-verification.yml','docs/training-pathway-intake.md','server/src/companion/pathways/router.ts','src/components/pathways/PathwayIntakeModal.tsx','src/components/pathways/pathways.css','src/components/pathways/api.ts','tests/pathways/fixtures.ts','tests/pathways/tracker_test.py','tests/pathways/ui.html','tests/pathways/domain.test.ts','tests/pathways/router.test.ts','tests/pathways/ui.tsx','tests/pathways/emulator.integration.ts','tests/pathways/browser_test.py','tests/pathways/ui-server.ts','data/training-pathways/learning-contract.json','data/training-pathways/README.md','data/training-pathways/templates/source-bundle.template.json','data/training-pathways/templates/source-rows.template.csv'}
          actual = {line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')}
          assert actual == expected, 'Unexpected patch paths'
          Path('/tmp/pathway-paths').write_text('\n'.join(sorted(expected))+'\n')
          PY
          git apply --check /tmp/pathway.patch
          git apply /tmp/pathway.patch
      - name: Commit implementation and remove transfer helpers
        shell: bash
        run: |
          while IFS= read -r path; do git add -- "$path"; done < /tmp/pathway-paths
          git rm -- scripts/pathway-patch.part1 scripts/pathway-patch.part2 scripts/pathway-patch.part3 scripts/pathway-patch.part4 .github/workflows/pathway-context.yml .github/workflows/pathway-apply.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(pathways): private source intake modal, strict review pipeline and learning contract'
          git push origin HEAD:feat/training-pathway-intake
