name: Apply reviewed nutrition source
on:
  push:
    branches: [feat/nutrition-knowledge]
    paths: ['.github/workflows/nutrition-apply.yml']
permissions:
  contents: write
concurrency:
  group: nutrition-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/nutrition-knowledge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/nutrition-knowledge
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline, checksum and exact changed paths
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          base='a5371584dafee52ed0d87da79788ee3089db85a7'
          paths=['.env.example','.github/workflows/nutrition.yml','data/knowledge/12_nutrition_meal_plan_sources.md','data/nutrition/README.md','data/nutrition/evaluation-cases.json','data/nutrition/learning-contract.json','data/nutrition/product-safety-basis.json','data/nutrition/review-issues.json','data/nutrition/source-documents.json','data/nutrition/template-mapping.json','docs/nutrition-knowledge.vi.md','scripts/prepare-nutrition.ts','server/src/handoverRules.ts','server/src/index.ts','server/src/intentClassifier.ts','server/src/nutrition/router.ts','shared/nutritionKnowledge.ts','shared/nutritionRouting.ts','shared/ragDocument.ts','tests/nutrition/domain.test.ts','tests/nutrition/router.test.ts','tests/nutrition/source-fingerprint.json','tsconfig.nutrition.json']
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--',*paths,'data/nutrition/meal-plan-library.json'],check=True)
          encoded=''.join(pathlib.Path(f'.nutrition-transfer/part{i:02}.b64').read_text().strip() for i in range(1,7))
          assert len(encoded)==43096, 'Unexpected transport length'
          compressed=base64.b64decode(encoded,validate=True)
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(compressed,max_length=2*1024*1024)
          assert decoder.eof and not decoder.unused_data, 'Incomplete or excessive compressed input'
          assert hashlib.sha256(patch).hexdigest()=='a026a4037e8cc4fa8416364f00245844f22d846dea10669bc64c7af8435f78c5', 'Patch checksum mismatch'
          target=pathlib.Path('/tmp/nutrition-source.patch'); target.write_bytes(patch)
          stats=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
          found=[line.split('\t',2)[2] for line in stats.splitlines()]
          assert sorted(found)==sorted(paths), 'Unexpected patch paths'
          assert b'GIT binary patch' not in patch and b'new file mode 120000' not in patch
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          pathlib.Path('/tmp/nutrition-allowed-paths.txt').write_text('\n'.join(paths+['data/nutrition/meal-plan-library.json'])+'\n')
          PY
      - name: Generate deterministic library without model or database calls
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install tsx scripts/prepare-nutrition.ts --write
          echo 'b98f63ce9191832eb0d6b915ea5f5bd72d7817d3d4bec147b8e1790643481bb1  data/nutrition/meal-plan-library.json' | sha256sum --check
      - name: Commit only reviewed files on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r file; do git add -- "$file"; done < /tmp/nutrition-allowed-paths.txt
          git rm -- .nutrition-transfer/part01.b64 .nutrition-transfer/part02.b64 .nutrition-transfer/part03.b64 .nutrition-transfer/part04.b64 .nutrition-transfer/part05.b64 .nutrition-transfer/part06.b64
          git commit -m 'feat(nutrition): add source-faithful meal knowledge, review API and guarded chat routing'
          git push origin HEAD:feat/nutrition-knowledge
