name: Apply reviewed metabolic source patch
on:
  push:
    branches: [feat/fatloss-metabolic-program]
    paths: ['.github/workflows/metabolic-apply.yml']
permissions:
  contents: write
concurrency:
  group: metabolic-reviewed-patch
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/fatloss-metabolic-program'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fatloss-metabolic-program
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the exact reviewed patch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feat/fatloss-metabolic-program'
          git merge-base --is-ancestor aa1e57951a42f97065ce8e9421078e88ec17ea3a HEAD
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''.join(Path(f'scripts/metabolic-patch.part{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '17eb5b1ed5e695b30d3cf80f75f5cc4fb1bd11f8b9260fd7458549ab9241d7e7', 'Patch hash mismatch'
          Path('/tmp/metabolic-reviewed.patch').write_bytes(patch)
          PY
          git apply --check /tmp/metabolic-reviewed.patch
          git apply --index /tmp/metabolic-reviewed.patch
      - name: Generate fingerprints and library without provider calls
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const base=JSON.parse(execFileSync('git',['show','aa1e57951a42f97065ce8e9421078e88ec17ea3a:data/companion/training_programs.json'],{encoding:'utf8'}));
          const source=JSON.parse(fs.readFileSync('data/training-pathways/fatloss-metabolic/source-sessions.json','utf8'));
          const hash=v=>createHash('sha256').update(JSON.stringify(v)).digest('hex');
          const result={baseCommit:'aa1e57951a42f97065ce8e9421078e88ec17ea3a',baseLibraryVersion:base.version,sourceSessionsSha256:hash(source.sessions),programHashes:Object.fromEntries(base.programs.map(p=>[p.id,hash(p)])),exerciseMetadataHashes:{},usageHashes:{},equipmentHashes:Object.fromEntries(base.equipmentReferences.map(e=>[e.id,hash(e)]))};
          for(const {programUsage,...meta} of base.exercises){result.exerciseMetadataHashes[meta.id]=hash(meta);result.usageHashes[meta.id]=hash(programUsage);}
          fs.writeFileSync('tests/fixtures/fatloss-metabolic-baseline.json',JSON.stringify(result,null,2)+'\n');
          JS
          npx --no-install tsx scripts/prepare-fatloss-metabolic.ts --out /tmp/metabolic-library.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('/tmp/metabolic-library.json').read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'f426a224c56a6d10ee547343b0bca545e7864354862ff38f6c26ed9e584bb600', 'Library hash mismatch'
          fp = Path('tests/fixtures/fatloss-metabolic-baseline.json').read_bytes()
          assert hashlib.sha256(fp).hexdigest() == '343349e7b7cf7a75b72ea6a80da52f589629e2b01a10ea353a419c0b661e0356', 'Fingerprint hash mismatch'
          Path('data/companion/training_programs.json').write_bytes(data)
          PY
          npx --no-install tsx scripts/validate-fatloss-metabolic.ts --report
      - name: Append isolated manual scenarios without rewriting legacy checklist
        run: |
          set -euo pipefail
          test "$(git hash-object docs/test-checklist.md)" = 'acf01c57fe9bd6de38b641736ec9a4271ac2a850'
          mkdir -p test-results/metabolic-transport
          cp docs/test-checklist.md test-results/metabolic-transport/test-checklist.base.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/test-checklist.md')
          addition=Path('data/training-pathways/fatloss-metabolic/checklist-append.md').read_bytes()
          assert addition not in p.read_bytes(), 'Checklist already appended'
          p.write_bytes(p.read_bytes()+b'\n\n'+addition)
          PY
          cp docs/test-checklist.md test-results/metabolic-transport/test-checklist.updated.md
      - name: Commit only allowed code and data, never workflow changes
        run: |
          set -euo pipefail
          git add data/companion/training_programs.json tests/fixtures/fatloss-metabolic-baseline.json docs/test-checklist.md
          python3 - <<'PY'
          import subprocess
          expected={
          'data/knowledge/10_program_fatloss_metabolic.md',
          'data/companion/training_programs.json',
          'data/training-pathways/fatloss-metabolic/README.md',
          'data/training-pathways/fatloss-metabolic/checklist-append.md',
          'data/training-pathways/fatloss-metabolic/scientific-claims.review.json',
          'data/training-pathways/fatloss-metabolic/source-sessions.json',
          'data/training-pathways/fatloss-metabolic/source-status.json',
          'docs/fatloss-metabolic-review.vi.md','docs/test-checklist.md',
          'scripts/prepare-fatloss-metabolic.ts','scripts/validate-fatloss-metabolic.ts',
          'server/src/intentClassifier.ts',
          'shared/fatlossMetabolicProgram.ts','shared/programSafety.ts','shared/ragDocument.ts','shared/trainingPrograms.ts',
          'tests/fatloss-metabolic.test.ts','tests/fixtures/fatloss-metabolic-baseline.json','tests/height-posture.test.ts'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert expected==actual, f'Unexpected paths: {actual.symmetric_difference(expected)}'
          PY
          git diff --cached --check
          git rm scripts/metabolic-patch.part0.b64 scripts/metabolic-patch.part1.b64 scripts/metabolic-patch.part2.b64 scripts/metabolic-patch.part3.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(programs): add historical metabolic pathway with clinical handover safeguards'
          git push origin HEAD:feat/fatloss-metabolic-program
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metabolic-checklist-transport
          path: test-results/metabolic-transport
          retention-days: 7
