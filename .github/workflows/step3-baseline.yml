name: Step 3 baseline verification
on:
  push:
    branches: [feat/member-memory-adaptive-workout]
    paths: [.github/workflows/step3-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing manifest (import currently has no lockfile)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Package installed public dependencies and resolved lock for offline tests
        run: tar -czf step3-dependencies.tar.gz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: step3-offline-dependencies
          path: step3-dependencies.tar.gz
          retention-days: 2
      - name: Baseline type check
        run: npm run lint
      - name: Baseline build
        run: npm run build
