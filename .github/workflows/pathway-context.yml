name: Scoped pathway source context
on:
  push:
    branches: [feat/training-pathway-intake]
    paths: ['.github/workflows/pathway-context.yml']
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package code only; exclude business source files and secrets
        run: |
          mkdir -p review-context
          git archive --format=zip --output=review-context/code.zip HEAD src server/src shared tests scripts package.json package-lock.json tsconfig.json tsconfig.training.json vite.config.ts index.html firestore.rules firestore.training.indexes.json firebase.training-test.json .gitignore .env.example .github/workflows/training.yml .github/workflows/gym-assets.yml
      - uses: actions/upload-artifact@v4
        with:
          name: pathway-code-context
          path: review-context/code.zip
          retention-days: 1
