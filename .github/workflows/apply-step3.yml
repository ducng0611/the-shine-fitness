name: Apply locally verified Step 3 implementation
on:
  push:
    branches: [feat/member-memory-adaptive-workout]
    paths: [.step3-delivery/ready.json, .github/workflows/apply-step3.yml]
permissions:
  contents: write
concurrency:
  group: step3-source-delivery
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/member-memory-adaptive-workout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/member-memory-adaptive-workout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source hashes and apply only the declared application files
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          m = json.loads(pathlib.Path('.step3-delivery/ready.json').read_text())
          assert m['base'] == 'd40f9d37dff128ab2fdf079276dbaac70c37e0d7'
          assert m['patchSha256'] == 'cced75f6aed0a9925a3457bced72a2b149ad1cf345a5131ba19e3a52f1ca1a8a'
          assert 1 <= m['parts'] <= 10
          for path, before in m['beforeBlobs'].items():
              p = pathlib.PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts
              assert path == '.env.example' or not p.name.startswith('.env')
              check = subprocess.run(['git', 'rev-parse', 'HEAD:' + path], capture_output=True, text=True)
              actual = check.stdout.strip() if check.returncode == 0 else None
              assert actual == before, 'Source changed since review: ' + path
          data = ''.join(pathlib.Path(f'.step3-delivery/part-{i}.txt').read_text().strip() for i in range(m['parts']))
          compressed = base64.b64decode(data, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == m['xzSha256']
          patch = lzma.decompress(compressed, memlimit=128*1024*1024)
          assert len(patch) < 1024*1024
          assert hashlib.sha256(patch).hexdigest() == m['patchSha256']
          pathlib.Path('/tmp/step3-reviewed.patch').write_bytes(patch)
          stat = subprocess.check_output(['git', 'apply', '--numstat', '/tmp/step3-reviewed.patch'], text=True)
          paths = [line.split('\t', 2)[2] for line in stat.splitlines()]
          assert sorted(paths) == sorted(m['files'])
          # The Actions token may write source but not workflow definitions.
          # The read-only permanent CI file is added separately through the authorized GitHub connector.
          exclude = '--exclude=.github/workflows/training.yml'
          subprocess.run(['git', 'apply', exclude, '--check', '/tmp/step3-reviewed.patch'], check=True)
          subprocess.run(['git', 'apply', exclude, '--index', '/tmp/step3-reviewed.patch'], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert not any(p.startswith('.github/workflows/') for p in staged)
          PY
      - name: Lock existing manifest without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run domain, service and HTTP tests
        run: npm run test:training
      - name: Strict new-module and full-project type checks
        run: npm run typecheck:training && npm run lint
      - name: Full application build
        run: npm run build
      - name: Commit application source on feature branch only
        run: |
          test "$(git branch --show-current)" = 'feat/member-memory-adaptive-workout'
          git add package-lock.json
          git rm .step3-delivery/*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(training): implement member memory and adaptive workout pilot with tests'
          git push origin HEAD:feat/member-memory-adaptive-workout
